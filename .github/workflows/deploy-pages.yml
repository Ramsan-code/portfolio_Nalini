# Builds the static export and publishes it to GitHub Pages.
# Enable it in: Settings → Pages → Build and deployment → Source: GitHub Actions.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build
        env:
          # Set the repository variable ROOT_PATH=true when using a custom domain
          # or a <user>.github.io repository (site served from "/").
          ROOT_PATH: ${{ vars.ROOT_PATH }}
          REPO_NAME: ${{ github.event.repository.name }}
          NEXT_PUBLIC_SITE_URL: ${{ vars.SITE_URL }}
          NEXT_PUBLIC_WEB3FORMS_KEY: ${{ secrets.WEB3FORMS_KEY }}
        run: |
          # Project sites live at https://<user>.github.io/<repo>/
          if [ "$ROOT_PATH" != "true" ]; then export NEXT_PUBLIC_BASE_PATH="/$REPO_NAME"; fi
          echo "basePath: '${NEXT_PUBLIC_BASE_PATH:-/}'"
          npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
